# Type check, tests and build on every PR, so a dependency bump has a real
# signal instead of only a bot's opinion.
#
# Node comes from .nvmrc, which holds the version the deployed container
# actually runs. Coolify builds mot with Nixpacks and NIXPACKS_NODE_VERSION=22,
# which currently materialises as 22.11.0. Pinning CI to `22` instead would
# resolve to the newest 22.x (22.23.2 at the time of writing) and quietly pass
# bumps whose `engines.node` floor sits above what production has. Keep .nvmrc
# and the Coolify env var in step; package.json `engines` records the same
# range.
#
# There is no lint step: ESLint was never configured here, and the two eslint
# packages were dropped once it was clear nothing read them.
#
# `npm run test:e2e` is also absent: Playwright needs browsers installed.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes anything back: checkout, install, run checks. The repo
# default is already read-only, but declaring it means an org- or repo-level
# default changing later cannot silently widen this workflow's token.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Build is not proof of boot. #32 shipped a `main` that compiled cleanly and then 500'd
      # every request, because the Edge middleware bundle only fails when the runtime actually
      # loads it. Typecheck/tests/build were green that whole time. So: start the built app and
      # assert the two routes that matter — the healthcheck Coolify gates deploys on, and a
      # middleware-gated route, which must redirect to /login rather than error.
      - name: Boot smoke test
        env:
          DATABASE_URL: /tmp/smoke.db
          MOT_SESSION_SECRET: ci-smoke-secret-long-enough-to-be-valid
          MOT_EMBED_DISABLE: '1'
        run: |
          set -euo pipefail
          npm start -- -p 3399 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -m 4 http://127.0.0.1:3399/api/status || true)" = "200" ]; then
              break
            fi
            sleep 2
          done

          health=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:3399/api/status)
          gated=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:3399/)
          echo "health=$health gated=$gated"

          [ "$health" = "200" ] || { echo "::error::/api/status returned $health, expected 200"; exit 1; }
          case "$gated" in
            30*) ;;
            *) echo "::error::/ returned $gated, expected a 3xx redirect to /login"; exit 1 ;;
          esac
