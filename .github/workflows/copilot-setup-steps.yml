name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Newest 24.x, not the runner's cached copy: 24.21.0 crashes a vitest
          # worker in tests/integration/memory-disable.test.ts; 24.22.0 passes.
          check-latest: true
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Type check
        run: npm run typecheck
