# Weekly dependency updates, grouped so a routine week is one PR rather than
# one per package. Major bumps stay ungrouped on purpose: those are the ones
# that deserve to be read individually.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # react, react-dom and their two @types packages have to move as one
      # unit. Bumped apart they cannot even install: @types/react-dom@19
      # requires @types/react@19, and npm fails with ERESOLVE (PR #8). Listed
      # first, and excluded from the catch-all, so neither group claims them
      # by accident.
      react-toolchain:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      javascript-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
    ignore:
      # better-sqlite3 13 cannot be installed by the Coolify/Nixpacks build.
      # 13.x bundles N-API prebuilds and sets "gypfile": false, but npm 10.9.2
      # (bundled with prod's Node 22.14) and npm 11 ignore that flag whenever a
      # lockfile is present, and run `node-gyp rebuild`, which needs Python
      # and a compiler the Nixpacks image lacks. CI passes because GitHub's
      # runner has both. npm 12 honours the flag. #23 shipped this, broke
      # every deploy, and was reverted in #61; options for landing it in #60.
      # 12.x still installs via prebuild-install and is not blocked.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]
      # Tailwind 4 is a migration (PostCSS plugin moved to
      # @tailwindcss/postcss, CSS-first config, renamed utilities), not a
      # bump. Tracked in #77; remove this once that lands.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
