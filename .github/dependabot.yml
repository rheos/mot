# Weekly dependency updates, grouped so a routine week is one PR rather than
# one per package. Major bumps stay ungrouped on purpose: those are the ones
# that deserve to be read individually.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # react, react-dom and their two @types packages have to move as one
      # unit. Bumped apart they cannot even install: @types/react-dom@19
      # requires @types/react@19, and npm fails with ERESOLVE (PR #8). Listed
      # first, and excluded from the catch-all, so neither group claims them
      # by accident.
      react-toolchain:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # vitest and any @vitest/* package must share one version. #80 and #81
      # split them: @vitest/runner sat in package.json as a stray devDependency
      # that nothing imported (vitest 5 no longer even depends on it), so
      # Dependabot bumped each on its own. The stray is gone; this group keeps
      # the next @vitest/* addition (coverage-v8, ui) moving with vitest.
      # vite is listed for the day it is declared directly; today it is only
      # vitest's dependency, so the pattern matches nothing.
      vitest-toolchain:
        patterns: ["vitest", "@vitest/*", "vite"]
      javascript-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "vitest", "@vitest/*", "vite"]
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind 4 is a migration (PostCSS plugin moved to
      # @tailwindcss/postcss, CSS-first config, renamed utilities), not a
      # bump. Tracked in #77; remove this once that lands.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
