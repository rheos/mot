# Weekly dependency updates, grouped so a routine week is one PR rather than
# one per package. Major bumps stay ungrouped on purpose: those are the ones
# that deserve to be read individually.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # react, react-dom and their two @types packages have to move as one
      # unit. Bumped apart they cannot even install: @types/react-dom@19
      # requires @types/react@19, and npm fails with ERESOLVE (PR #8). Listed
      # first, and excluded from the catch-all, so neither group claims them
      # by accident.
      react-toolchain:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      javascript-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
